name: Azahar Upstream Sync and Release

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the current upstream revision even if already synchronized'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/azahar-auto-sync-release.yml'

permissions:
  contents: write

concurrency:
  group: azahar-upstream-sync-release
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pull.outputs.changed }}
      sha: ${{ steps.pull.outputs.sha }}
      upstream_sha: ${{ steps.pull.outputs.upstream_sha }}
    steps:
      - name: Checkout the automation branch with full history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - name: Sync upstream source without modifying fork workflow files
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/azahar-emu/azahar.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin master
          git checkout -B master refs/remotes/origin/master
          current="$(git rev-parse HEAD)"
          target="$(git rev-parse refs/remotes/upstream/master)"
          echo "upstream_sha=$target" >> "$GITHUB_OUTPUT"
          state=.github/azahar-upstream.sha
          if [ -f "$state" ]; then
            previous=$(cat "$state")
          else
            previous=$(git merge-base "$current" "$target")
          fi
          test -n "$previous" && git cat-file -e "$previous^{commit}"
          if [ "$previous" = "$target" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$current" >> "$GITHUB_OUTPUT"
            echo "Already synchronized source: $target"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$previous" "$target"; then
            echo '::error::Upstream history was rewritten; refusing an unsafe sync.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          patch="$RUNNER_TEMP/azahar-upstream.patch"
          # A GITHUB_TOKEN cannot push changes to .github/workflows; keep the fork's reviewed workflows.
          git diff --binary "$previous" "$target" -- . ':(exclude).github/workflows/**' > "$patch"
          if [ -s "$patch" ]; then
            git apply --3way --index "$patch"
          fi
          printf '%s\n' "$target" > "$state"
          git add "$state"
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo '::error::Refusing to modify fork workflow files.'
            exit 1
          fi
          git commit -m "chore(sync): upstream source $target"
          git push origin HEAD:master
          mirrored=$(git rev-parse HEAD)
          echo "sha=$mirrored" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Synchronized upstream $target into fork commit $mirrored without workflow writes."

  linux:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build == true) }}
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      OS: linux
      TARGET: appimage
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive
      - name: Use official PNG icon for AppImage packaging
        shell: bash
        run: |
          set -euo pipefail
          # Newer appimagetool requires a PNG/XPM icon to generate .DirIcon.
          # Keep the upstream master branch untouched; patch only this CI checkout.
          test -s dist/azahar.png
          cmake_script=CMakeModules/BundleTarget.cmake
          grep -Fq '/dist/azahar.svg' "$cmake_script"
          grep -Fq '/dist/org.azahar_emu.Azahar.svg' "$cmake_script"
          sed -i \
            -e 's@/dist/azahar.svg@/dist/azahar.png@g' \
            -e 's@/dist/org.azahar_emu.Azahar.svg@/dist/org.azahar_emu.Azahar.png@g' \
            "$cmake_script"
          grep -Fq '/dist/azahar.png' "$cmake_script"
          grep -Fq '/dist/org.azahar_emu.Azahar.png' "$cmake_script"
      - name: Build AppImage
        run: ./.ci/linux.sh
      - name: Collect AppImage
        run: |
          mkdir -p artifacts
          mv build/bundle/*.AppImage artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: azahar-linux
          path: artifacts/
          if-no-files-found: error

  windows:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build == true) }}
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      OS: windows
      TARGET: mxe
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive
      - name: Build Windows MXE
        run: ./.ci/win-mxe.sh
      - name: Pack Windows build
        run: ./.ci/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: azahar-windows
          path: artifacts/
          if-no-files-found: error

  macos:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build == true) }}
    runs-on: macos-26
    env:
      OS: macos
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive
      - name: Install tools
        run: brew install ccache ninja spirv-tools
      - name: Install Conan
        uses: conan-io/setup-conan@v1
      - name: Build FFmpeg dependencies
        run: |
          conan install --output-folder="$HOME/conan" --generator=CMakeToolchain \
            --build=missing -s os.version=13.4 \
            -o "*:shared=True" -o "*:with_libfdk_aac=False" \
            --requires=ffmpeg/7.1.5 \
            -c "ffmpeg/*:tools.build:sharedlinkflags+=['-Wl,-flat_namespace']" \
            -c "ffmpeg/*:tools.build:exelinkflags+=['-Wl,-flat_namespace']"
      - name: Build ARM64
        run: BUILD_ARCH=arm64 ./.ci/macos.sh
      - name: Build x86_64
        run: BUILD_ARCH=x86_64 ./.ci/macos.sh
      - name: Create universal macOS build
        run: ./.ci/macos-universal.sh
      - name: Pack macOS applications
        env:
          PACK_INDIVIDUALLY: '1'
        run: |
          mkdir -p build/bundle
          cp -R build/x86_64/bundle build/bundle/x86_64
          cp -R build/arm64/bundle build/bundle/arm64
          cp -R build/universal/bundle build/bundle/universal
          ./.ci/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: azahar-macos
          path: artifacts/
          if-no-files-found: error

  android:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build == true) }}
    runs-on: ubuntu-latest
    env:
      OS: android
      TARGET: vanilla
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Install requested Android CMake
        run: |
          echo y | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3"
      - name: Build Android Vanilla
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - name: Pack Android APK and AAB
        working-directory: src/android/app
        env:
          UNPACKED: '1'
        run: ../../../.ci/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: azahar-android
          path: src/android/app/artifacts/
          if-no-files-found: error

  release:
    needs: [sync, linux, windows, macos, android]
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download completed platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: azahar-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after successful builds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.sync.outputs.sha }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were collected."
            exit 1
          fi
          tag="upstream-${UPSTREAM_SHA:0:12}"
          printf 'Upstream: https://github.com/azahar-emu/azahar\nUpstream commit: %s\nFork build commit: %s\n\nAutomated Windows, Linux, macOS, and Android build. Not an official Azahar release.\n' "$UPSTREAM_SHA" "$BUILD_SHA" > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving it unchanged."
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$BUILD_SHA" \
              --title "Azahar upstream ${UPSTREAM_SHA:0:12}" \
              --notes-file release-notes.md \
              --prerelease
          fi
